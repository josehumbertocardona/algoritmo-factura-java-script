<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura Web</title>
    <link rel="stylesheet" href="estilo.css">
    </head>
<body>
    <div class="contenedor">
    <h1>factura web</h1>
    <form action=""  method="get">
        <input type="number" name="ide" id="ide" placeholder="ingrese su identificacion"> <br> <br>
      <input type="text" name="nom" id="nom" placeholder="ingrese su nombre y apellidos"> <br> <br>  
      <input type="text" name="dir" id="dir" placeholder="ingrese su direccion"> <br> <br>
      <input type="number" name="tel" id="tel" placeholder="ingrese su numero de telefono"> <br> <br>  
      <input type="number" name="nfac" id="nfac" placeholder="ingrese el numero de factura"> <br> <br>
      <input type="text" name="fecha" id="fecha" placeholder="ingrese la fecha"> <br> <br>
      <input type="text" name="rz" id="rz" placeholder="ingrese la razon social"> <br> <br>
      <input type="text" name="p" id="p" placeholder="ingrese el producto"> <br> <br>
      <input type="number" name="cant" id="cant" placeholder="ingrese la cantidad"> <br> <br>
      <input type="number" name="vu" id="vu" placeholder="ingrese el valor unitario"> <br> <br>
      <input type="button" value="mostrar factura" onclick="buscar()">
         <script src="./main.js"></script>
     </form>
     </div>
</body>
</html>
